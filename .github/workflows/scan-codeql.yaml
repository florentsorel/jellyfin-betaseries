name: '🔬 Run CodeQL'

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  call:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@6fe2b8eb26749491b497560fd6c54f6522e1e34f # master
    with:
      repository-name: florentsorel/jellyfin-betaseries
